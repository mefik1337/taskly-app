name: Set up the test agent tooling
description: Create an isolated virtual environment with the hash-pinned test agent tooling.
inputs:
  requirements:
    description: Requirements file to install, relative to the repository root.
    default: test-agent/requirements.txt
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m venv test-agent/.venv
        test-agent/.venv/bin/python -m pip install --disable-pip-version-check --quiet \
          --require-hashes --no-deps -r "$REQUIREMENTS"
