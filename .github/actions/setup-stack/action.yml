name: Set up one application stack
description: Install the toolchain and dependencies needed to run the test suite of one stack.
inputs:
  stack:
    description: The stack to set up, backend or frontend.
    required: true
runs:
  using: composite
  steps:
    - if: inputs.stack == 'backend'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - if: inputs.stack == 'backend'
      shell: bash
      run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
    - if: inputs.stack == 'frontend'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - if: inputs.stack == 'frontend'
      shell: bash
      working-directory: frontend
      run: npm ci --no-audit --no-fund
