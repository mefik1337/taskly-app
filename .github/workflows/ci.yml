name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-stacks
        with:
          frontend: "false"
      - name: Test with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-stacks
        with:
          backend: "false"
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

  test-agent-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-cov==7.1.0
      - name: Test the workflow tooling
        working-directory: test-agent
        run: python -m pytest --cov --cov-report=term-missing
