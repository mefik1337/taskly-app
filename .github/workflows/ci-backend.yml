name: CI (backend)

on:
  push:
    branches: [main]
    paths: &paths
      - "backend/**"
      - ".github/actions/setup-stack/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-stack
        with:
          stack: backend
      - name: Test with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing
