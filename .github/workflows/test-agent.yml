name: Test agent

on:
  workflow_call:
    inputs:
      stack:
        description: The stack whose changes the agent covers, backend or frontend.
        type: string
        required: true

permissions: {}

env:
  CLAUDE_CODE_VERSION: "2.1.308"
  STACK: ${{ inputs.stack }}
  WORKSPACE: .test-agent/${{ inputs.stack }}
  TEST_AGENT_PYTHON: test-agent/.venv/bin/python
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  analyze:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.analysis.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-test-agent
      - uses: ./.github/actions/setup-stack
        with:
          stack: ${{ inputs.stack }}
      - name: Measure the change before the agent
        id: analysis
        run: |
          "$TEST_AGENT_PYTHON" test-agent/main.py analyze --stack "$STACK" --base "$BASE_SHA" --workspace "$WORKSPACE"
          echo "has_targets=$(jq '.targets | length > 0' "$WORKSPACE/analysis.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-${{ inputs.stack }}-analysis
          path: |
            ${{ env.WORKSPACE }}/pr.diff
            ${{ env.WORKSPACE }}/analysis.json
          retention-days: 14

  generate:
    needs: analyze
    if: needs.analyze.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: test-agent
    permissions:
      contents: read
    env:
      TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL || 'claude-sonnet-5-5' }}
      TEST_AGENT_MAX_TURNS: ${{ vars.TEST_AGENT_MAX_TURNS || '80' }}
      TEST_AGENT_MAX_BUDGET_USD: ${{ vars.TEST_AGENT_MAX_BUDGET_USD || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-${{ inputs.stack }}-analysis
          path: ${{ env.WORKSPACE }}
      - uses: ./.github/actions/setup-test-agent
      - uses: ./.github/actions/setup-stack
        with:
          stack: ${{ inputs.stack }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Run the test-engineer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [[ -n "$ANTHROPIC_API_KEY" ]] || unset ANTHROPIC_API_KEY
          [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [[ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret in the test-agent environment."
            exit 1
          fi
          test-agent/bin/run-agent --stack "$STACK" --mode run --workspace "$WORKSPACE"
      - name: Check the full suite after the agent
        id: selfcheck
        run: |
          if [[ ! -f "$WORKSPACE/agent-report.json" ]]; then
            echo "red=false" >> "$GITHUB_OUTPUT"
          elif "$TEST_AGENT_PYTHON" test-agent/main.py selfcheck --stack "$STACK" --workspace "$WORKSPACE"; then
            echo "red=false" >> "$GITHUB_OUTPUT"
          else
            echo "red=true" >> "$GITHUB_OUTPUT"
            jq -c '.failed_cases' "$WORKSPACE/selfcheck.json"
          fi
      - name: Repair failing tests in the same agent session
        if: steps.selfcheck.outputs.red == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [[ -n "$ANTHROPIC_API_KEY" ]] || unset ANTHROPIC_API_KEY
          [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || unset CLAUDE_CODE_OAUTH_TOKEN
          test-agent/bin/run-agent --stack "$STACK" --mode repair --workspace "$WORKSPACE"
      - name: Capture the agent's changes
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git add --intent-to-add --all
          git diff --no-color --binary > "$WORKSPACE/agent.patch"
          for file in agent.patch transcript.jsonl; do
            "$TEST_AGENT_PYTHON" test-agent/main.py redact --file "$WORKSPACE/$file" \
              --env ANTHROPIC_API_KEY --env CLAUDE_CODE_OAUTH_TOKEN
          done
          git apply --numstat "$WORKSPACE/agent.patch" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-agent-${{ inputs.stack }}-output
          path: |
            ${{ env.WORKSPACE }}/agent.patch
            ${{ env.WORKSPACE }}/agent-report.json
            ${{ env.WORKSPACE }}/agent-run.json
            ${{ env.WORKSPACE }}/selfcheck.json
            ${{ env.WORKSPACE }}/transcript.jsonl
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: [analyze, generate]
    if: ${{ !cancelled() && needs.generate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-agent-${{ inputs.stack }}-*
          merge-multiple: true
          path: ${{ env.WORKSPACE }}
      - uses: ./.github/actions/setup-test-agent
      - uses: ./.github/actions/setup-stack
        with:
          stack: ${{ inputs.stack }}
      - name: Guard, apply and re-run the agent's tests without secrets
        run: |
          "$TEST_AGENT_PYTHON" test-agent/main.py verify --stack "$STACK" --workspace "$WORKSPACE"
          jq '{violations, suites: [.suites[] | {name, tests, failed}]}' "$WORKSPACE/verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-agent-${{ inputs.stack }}-verification
          path: |
            ${{ env.WORKSPACE }}/verification.json
            ${{ env.WORKSPACE }}/verified.patch
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [analyze, generate, verify]
    if: ${{ !cancelled() && needs.analyze.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AUTO_COMMIT: ${{ vars.TEST_AGENT_AUTO_COMMIT || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-agent-${{ inputs.stack }}-*
          merge-multiple: true
          path: ${{ env.WORKSPACE }}
      - uses: ./.github/actions/setup-test-agent
      - name: Resolve the outcome
        id: outcome
        run: |
          status=$("$TEST_AGENT_PYTHON" test-agent/main.py status --workspace "$WORKSPACE")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Outcome: $status"
      - name: Commit the verified tests to the pull request branch
        id: commit
        if: steps.outcome.outputs.status == 'verified' && env.AUTO_COMMIT == 'true'
        run: |
          "$TEST_AGENT_PYTHON" test-agent/main.py guard --stack "$STACK" --workspace "$WORKSPACE"             --patch "$WORKSPACE/verified.patch"
          git apply --whitespace=nowarn "$WORKSPACE/verified.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- "$STACK"
          git commit --quiet --message "test: add ${STACK} unit tests for #${PR_NUMBER}"
          pushed=false
          if git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            pushed=true
          else
            git fetch --quiet origin "$HEAD_REF"
            if git diff --quiet HEAD^ FETCH_HEAD -- "$STACK" && git rebase --quiet FETCH_HEAD \
              && git push origin "HEAD:refs/heads/${HEAD_REF}"; then
              pushed=true
            fi
          fi
          if [[ "$pushed" == "true" ]]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            gh workflow run "ci-${STACK}.yml" --ref "$HEAD_REF"
          else
            echo "::warning::The ${STACK} code moved since the agent ran; the verified patch is attached as an artifact instead."
          fi
      - name: Render the report
        env:
          STATUS: ${{ steps.outcome.outputs.status }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          final="$STATUS"
          if [[ "$STATUS" == "verified" ]]; then
            if [[ -n "$COMMIT_SHA" ]]; then final=committed; else final=verified_not_committed; fi
          fi
          "$TEST_AGENT_PYTHON" test-agent/main.py comment --stack "$STACK" --workspace "$WORKSPACE" \
            --status "$final" --commit-sha "$COMMIT_SHA" --run-url "$RUN_URL" --out "$WORKSPACE/comment.md"
          cat "$WORKSPACE/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the sticky pull request comment
        run: |
          marker="<!-- taskly-test-agent:${STACK} -->"
          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | head -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F "body=@$WORKSPACE/comment.md" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@$WORKSPACE/comment.md" > /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.outcome.outputs.status == 'verified' && steps.commit.outputs.sha == ''
        with:
          name: test-agent-${{ inputs.stack }}-patch
          path: ${{ env.WORKSPACE }}/verified.patch
          retention-days: 14
      - name: Fail on rejected or failing tests
        if: steps.outcome.outputs.status == 'rejected' || steps.outcome.outputs.status == 'verification_failed'
        env:
          STATUS: ${{ steps.outcome.outputs.status }}
        run: |
          echo "::error::Test agent outcome for ${STACK}: $STATUS. See the pull request comment for details."
          exit 1
